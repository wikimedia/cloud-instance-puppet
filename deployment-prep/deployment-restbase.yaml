profile::cassandra::instances:
  deployment-restbase05.deployment-prep.eqiad1.wikimedia.cloud: {}
profile::java::java_packages:
- variant: jdk
  version: '11'
profile::lvs::realserver::pools:
  restbase-https:
    services:
    - restbase
    - envoyproxy
profile::restbase::cassandra_datacenters:
- datacenter1
profile::restbase::cassandra_local_dc: datacenter1
profile::restbase::cassandra_password: cassandra
profile::restbase::cassandra_tls: {}
profile::restbase::cassandra_user: cassandra
profile::restbase::citoid_uri: http://deployment-docker-citoid03.deployment-prep.eqiad1.wikimedia.cloud:1970
profile::restbase::cxserver_uri: http://deployment-docker-cxserver03.deployment-prep.eqiad1.wikimedia.cloud:8080
profile::restbase::event_service_uri: http://deployment-eventgate-4.deployment-prep.eqiad1.wikimedia.cloud:8292/v1/events
profile::restbase::hosts:
- deployment-restbase05.deployment-prep.eqiad1.wikimedia.cloud
profile::restbase::logging_label: restbase
profile::restbase::mathoid_uri: http://deployment-docker-mathoid03.deployment-prep.eqiad1.wikimedia.cloud:10044
profile::restbase::mobileapps_uri: http://deployment-docker-mobileapps02.deployment-prep.eqiad1.wikimedia.cloud:8888
profile::restbase::monitor_domain: en.wikipedia.org
profile::restbase::parsoid_uri: https://phabricator.wikimedia.org/T385902
profile::restbase::proton_uri: http://deployment-docker-proton01.deployment-prep.eqiad1.wikimedia.cloud:3030
profile::restbase::recommendation_uri: http://deployment-sca01.deployment-prep.eqiad.wmflabs:9632
profile::restbase::salt_key: secretkey
profile::restbase::seeds_ng:
- deployment-restbase05.deployment-prep.eqiad1.wikimedia.cloud
profile::restbase::wikifeeds_uri: http://wikifeeds.svc.deployment-prep.eqiad1.wikimedia.cloud:8889
profile::services_proxy::envoy::enabled_listeners:
- restbase-https
profile::services_proxy::envoy::listeners:
- name: restbase-https
  port: 8443
  service: restbase-https
  timeout: 60s
  upstream: '%{facts.networking.fqdn}'
profile::tlsproxy::envoy::capitalize_headers: false
profile::tlsproxy::envoy::global_cert_name: restbase.discovery.wmnet
profile::tlsproxy::envoy::sni_support: 'no'
profile::tlsproxy::envoy::tls_port: 1024
service::catalog:
  restbase-https:
    description: RESTBase, restbase.svc.%{::site}.wmnet - HTTPS
    discovery:
    - active_active: true
      dnsdisc: restbase
    - active_active: true
      dnsdisc: restbase-async
    encryption: true
    ip:
      eqiad:
        default: 127.0.0.1
    lvs:
      class: low-traffic
      conftool:
        cluster: restbase
        service: restbase-ssl
      depool_threshold: 0.5
      enabled: true
      monitors:
        IdleConnection:
          max-delay: 300
          timeout-clean-reconnect: 3
        ProxyFetch:
          url:
          - https://localhost/
      scheduler: wrr
    port: 7443
    probes:
    - type: http
    - type: swagger
    sites:
    - eqiad
    - codfw
    state: production
