profile::etcd::tlsproxy::acls:
  /:
  - root
  /conftool:
  - root
  - conftool
profile::etcd::tlsproxy::allow_unauth_ro: false
profile::etcd::tlsproxy::cert_name: etcd
profile::etcd::tlsproxy::cert_provider: acmechief
profile::etcd::tlsproxy::listen_port: 4001
profile::etcd::tlsproxy::read_only: false
profile::etcd::tlsproxy::tls_upstream: true
profile::etcd::tlsproxy::upstream_cert: '%{facts.puppet_config.hostcert}'
profile::etcd::tlsproxy::upstream_key: '%{facts.puppet_config.hostprivkey}'
profile::etcd::tlsproxy::upstream_port: 2379
profile::firewall::provider: nftables
profile::wmcs::etcd::adv_client_port: '%{alias(''profile::etcd::tlsproxy::listen_port'')}'
profile::wmcs::etcd::enable_v2: true
puppetmaster: cloudinfra-internal-puppetserver-1.cloudinfra.eqiad1.wikimedia.cloud
